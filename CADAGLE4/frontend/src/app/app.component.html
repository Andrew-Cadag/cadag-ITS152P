<header class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand">Cadag Blog</a>
        <nav class="pill-nav">
            <a href="/" [class.active]="path === '/'">Home</a>
            <ng-container *ngIf="!tokenStorage.getToken()">
                <a href="/login" [class.active]="path === '/login'">Login</a>
                <a href="/register" [class.active]="path === '/register'">Register</a>
            </ng-container>
            <ng-container *ngIf="tokenStorage.getToken()">
                <span class="status"><i></i>Logged in</span>
                <a href="#" (click)="logout(); $event.preventDefault()">Logout</a>
            </ng-container>
        </nav>
    </div>
</header>

<main class="container">
    <router-outlet></router-outlet>
</main>

<footer class="footer">Cadag Blog &middot; ITS152P FOPM01</footer>
