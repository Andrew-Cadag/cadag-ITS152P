<a href="/" class="back">&larr; All posts</a>

<article *ngIf="post">
    <p class="meta">{{ post.dateCreated | date:'MMMM d, y' }}</p>
    <h1><a href="/posts/{{ post.id }}"> {{ post.title }} </a></h1>
    <p class="byline">by {{ post.firstName }} {{ post.lastName }} <span>&#64;{{ post.userName }}</span></p>
    <p class="content">{{ post.body }}</p>
</article>
